config_version = 1
harness_version = "1.0.0"
project_name = "example"
project_type = "generic"
context_files = []
ci_files = []
detected_files = []
workspace_members = []
build_entrypoints = []
protected_paths = [".git/", ".env", ".env.*", ".harness/config.toml", ".harness/state.json", ".harness/PROJECT_STATE.md", ".harness/CURRENT_STAGE.md", ".harness/runtime/", "AGENTS.md", "ARCHITECTURE.md", "PROJECT_BRIEF.md", "HARNESS_ADOPTION_REPORT.md"]
max_slice_attempts = 3
error_excerpt_limit = 1200
worker_timeout_seconds = 3600
gate_timeout_seconds = 1800

[commands]
formatter = []
lint = []
check = []
unit_test = []
integration_test = []

[gates]
fast = []
slice = []
stage = []

[agent_runtime]
adapter_argv = ["python3", "{skill_root}/adapters/codex_cli.py"]
ephemeral = true
preflight_argv = []
preflight_timeout_seconds = 60

[agent_runtime.models]
# Optional role routing. Omit keys to use the configured runtime default.
# implementer = "deployment-alias"
# reviewer = "deployment-alias"
# tester = "deployment-alias"
# security_reviewer = "deployment-alias"
# verifier = "deployment-alias"
# explorer = "deployment-alias"
# researcher = "deployment-alias"
# test_triage = "deployment-alias"
# log_triage = "deployment-alias"
# architecture_analyst = "deployment-alias"
# auditor = "deployment-alias"
# final_lifecycle_reviewer = "deployment-alias"

[agent_runtime.reasoning_efforts]
# Optional per-role effort. Omit keys to let the selected adapter apply its policy.
# implementer = "high"
# reviewer = "high"
# tester = "high"
# security_reviewer = "high"
# verifier = "high"
# explorer = "high"
# researcher = "high"
# test_triage = "high"
# log_triage = "high"
# architecture_analyst = "high"
# auditor = "high"
# final_lifecycle_reviewer = "high"

[language]
internal_language = "en"
repository_language = "en"
agent_instruction_language = "en"
agent_report_language = "en"
operator_language = "auto"
correct_operator_grammar = false

[context_maintenance]
enabled = true
idle_compaction_threshold = 0.45
max_compactions_per_worker_run = 1
min_tokens_since_last_compaction = 20000
rehydrate_after_compaction = true

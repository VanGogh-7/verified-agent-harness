config_version = 1
harness_version = "0.5.0"
project_name = "example"
project_type = "generic"
context_files = []
ci_files = []
detected_files = []
workspace_members = []
build_entrypoints = []
protected_paths = [".git/", ".env", ".env.*", ".harness/config.toml", ".harness/state.json", ".harness/runtime/", "AGENTS.md", "ARCHITECTURE.md", "PROJECT_BRIEF.md", "HARNESS_ADOPTION_REPORT.md"]
max_slice_attempts = 3
error_excerpt_limit = 1200
worker_timeout_seconds = 3600
gate_timeout_seconds = 1800

[commands]
formatter = []
lint = []
check = []
unit_test = []
integration_test = []

[gates]
fast = []
slice = []
stage = []

[codex]
command = ["codex"]
implementer_sandbox = "workspace-write"
reviewer_sandbox = "read-only"
ephemeral = true

[language]
internal_language = "en"
repository_language = "en"
agent_instruction_language = "en"
agent_report_language = "en"
operator_language = "auto"
correct_operator_grammar = false
strict_engineering_language = true
product_localization_paths = []

[context_maintenance]
enabled = true
idle_compaction_threshold = 0.45
max_compactions_per_worker_run = 1
min_tokens_since_last_compaction = 20000
rehydrate_after_compaction = true
